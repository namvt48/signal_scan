server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API backend (docker-compose service "api"); no trailing slash on
    # proxy_pass so /api/... paths pass through unrewritten.
    # API proxy qua compose network. resolver 127.0.0.11 = Docker embedded DNS:
    # tránh crash lúc startup khi container api chưa kịp register DNS
    # (race cố hữu của nginx với static upstream).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # hashed build assets: cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
