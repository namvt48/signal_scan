server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # Caddy sits in front of this server, so the upstream request carries Via.
    # Default gzip_proxied=off would silently skip every /api JSON response.
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API backend uses the instance-specific Docker alias from NGINX_API_UPSTREAM.
    # The official nginx entrypoint substitutes the variable in this template at startup.
    # No trailing slash on proxy_pass so /api/... paths pass through unchanged.
    # Docker embedded DNS resolver avoids startup failure before the API registers.
    # Standalone partner API. This prefix must win over the dashboard backend proxy.
    location ^~ /api/v1/ {
        resolver 127.0.0.11 valid=10s;
        set $public_api_upstream http://signal-scan-public-api:3010;
        proxy_pass $public_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://${NGINX_API_UPSTREAM}:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # hashed build assets: cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        # Firebase signInWithPopup needs the opener relationship to survive. Without
        # same-origin-allow-popups the browser blocks the window.closed poll (console:
        # "Cross-Origin-Opener-Policy policy would block the window.closed call") so a
        # dismissed popup is only noticed seconds later — the button sits on "Signing in…".
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
